# Cascade Mask R-CNN (filament.detection.cascade): three box stages trained at IoU 0.5 / 0.6 / 0.7 (box-regression
# weights 10/20/30, stage loss weights 1 / 0.5 / 0.25), each refining the previous stage's boxes; score = mean of the
# stages, box = last stage; mask head (56 x 56) on the final boxes. All other settings as
# maskrcnn/maskrcnn_r50_v2_m56_ftall.yaml (whole backbone at lr x 0.25, batch 6, 2 warm-up epochs, 32 epochs), so
# the two runs differ only in the box heads. ~11.3 GiB at batch 6 (1.9 GiB per image; batch 8 would need ~15 GiB).
name: cascade_r50_v2_m56_ftall
arch: cascade
pretrained: true
trainable_layers: 5
backbone_lr_mult: 0.25
mask_size: 56
detections_per_img: 100
crop: 1024
batch_size: 6
epochs: 32
samples_per_epoch: 2000
pos_fraction: 0.8
min_instance_area: 30
augment: base
lr: 1.5e-4
weight_decay: 1.0e-4
warmup_epochs: 2
grad_clip: 10.0
amp: fp16
num_workers: 4
val_every: 2
val_mask_threshold: 0.5
val_score_thresholds: [0.3, 0.5, 0.7]
val_min_area: 100
seed: 42
