# DINOv3 backbone: as maskrcnn_r50_v2_m56_ftall (reference 0.446), but the ResNet50 is replaced by a ConvNeXt-Tiny
# with DINOv3 weights (timm convnext_tiny.dinov3_lvd1689m) and a new FPN (filament.detection.model.TimmFPNBackbone);
# the COCO RPN, box / mask heads and the FPN's 3x3 output convolutions are kept, only the FPN's 1x1 input
# convolutions start from scratch. Laptop benchmark (batch 2, real crops): 2.17 vs 1.79 GiB per image, 0.38 vs
# 0.28 s per step -> batch 4 / lr 1e-4 (linear scaling, as the cascade; batch 6 would come close to the T4's limit on
# crowded crops) and ~775 s per epoch on a T4: the schedule is shortened to what fits in 5.6 h (~24 epochs; the
# 20-epoch Dice run already matched 32 epochs).
name: maskrcnn_dinov3_convnext_t_m56
arch: maskrcnn
backbone: convnext_tiny.dinov3_lvd1689m
pretrained: true
trainable_layers: 5
backbone_lr_mult: 0.25
mask_size: 56
detections_per_img: 100
crop: 1024
batch_size: 4
epochs: 32
samples_per_epoch: 2000
pos_fraction: 0.8
min_instance_area: 30
augment: base
lr: 1.0e-4
weight_decay: 1.0e-4
warmup_epochs: 2
grad_clip: 10.0
amp: fp16
num_workers: 4
val_every: 2
val_mask_threshold: 0.5
val_score_thresholds: [0.3, 0.5, 0.7]
val_min_area: 100
max_hours: 5.6
fit_epochs: true
seed: 42
