# Copy-paste augmentation (filament.detection.copy_paste): as maskrcnn_r50_v2_m56_ftall (reference 0.446), but half
# of the annotated crops get 1-3 training filaments of the same site pasted in (as darkness relative to their own
# background, on the disk, at a similar distance from the centre, away from every annotator's filaments).
# ~+50 ms of CPU per pasted crop; max_hours only as a safety net (32 epochs ~5.3 h on a T4).
name: maskrcnn_r50_v2_m56_ftall_cp
copy_paste_p: 0.5
copy_paste_max: 3
arch: maskrcnn
pretrained: true
trainable_layers: 5
backbone_lr_mult: 0.25
mask_size: 56
detections_per_img: 100
crop: 1024
batch_size: 6
epochs: 32
samples_per_epoch: 2000
pos_fraction: 0.8
min_instance_area: 30
augment: base
lr: 1.5e-4
weight_decay: 1.0e-4
warmup_epochs: 2
grad_clip: 10.0
amp: fp16
num_workers: 4
val_every: 2
val_mask_threshold: 0.5
val_score_thresholds: [0.3, 0.5, 0.7]
val_min_area: 100
max_hours: 7.0
fit_epochs: true
seed: 42
