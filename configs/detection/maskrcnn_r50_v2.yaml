# Step 4: first instance model. torchvision Mask R-CNN ResNet50-FPN v2 (COCO weights), heads for 1 class.
# Trained on 1024 px crops at native resolution (no resizing), predicted on full 2048 px images.
# Same augmentations and annotator sampling as the U-Net. Raw detections are saved; the mask threshold and score
# cut-off are tuned afterwards on OOF PQ (scripts/postprocess/tune_postprocess.py).
name: maskrcnn_r50_v2
pretrained: true
trainable_layers: 3
mask_size: 28
detections_per_img: 100
crop: 1024
batch_size: 4
epochs: 24
samples_per_epoch: 2000
pos_fraction: 0.8
min_instance_area: 30
augment: base
lr: 1.0e-4
weight_decay: 1.0e-4
warmup_epochs: 1
grad_clip: 10.0
amp: fp16
num_workers: 4
val_every: 2
val_mask_threshold: 0.5
val_score_thresholds: [0.3, 0.5, 0.7]
val_min_area: 100
seed: 42
