# As maskrcnn_r50_v2, but the mask head predicts 56 x 56 instead of 28 x 28 masks (RoI 28 instead of 14): finer
# outlines for thin filaments, the known weak spot of Mask R-CNN. ~5 GiB peak at batch 4 (1024 px crops).
name: maskrcnn_r50_v2_m56
pretrained: true
trainable_layers: 3
mask_size: 56
detections_per_img: 100
crop: 1024
batch_size: 4
epochs: 24
samples_per_epoch: 2000
pos_fraction: 0.8
min_instance_area: 30
augment: base
lr: 1.0e-4
weight_decay: 1.0e-4
warmup_epochs: 1
grad_clip: 10.0
amp: fp16
num_workers: 4
val_every: 2
val_mask_threshold: 0.5
val_score_thresholds: [0.3, 0.5, 0.7]
val_min_area: 100
seed: 42
