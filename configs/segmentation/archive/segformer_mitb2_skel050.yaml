# Transformer screen: the original SegFormer: MiT-B2 encoder + its lightweight all-MLP head (predicts at 1/4 resolution).
# skel050 recipe, batch 16; transformer fine-tuning defaults: encoder lr x0.1 (7e-5, as in SegFormer), weight decay 0.01.
name: segformer_mitb2_skel050
arch: Segformer
encoder: mit_b2
pretrained: true
crop: 512
batch_size: 16
epochs: 30
samples_per_epoch: 4000
pos_fraction: 0.7
augment: base
lr: 0.0007
encoder_lr_mult: 0.1
weight_decay: 0.01
warmup_epochs: 2
bce_weight: 1.0
dice_weight: 1.0
skel_weight: 0.5
skel_radius: 1
target_mode: random
amp: fp16
infer_tile: 1024        # full 2048 images need a 4 GiB attention block: predict in tiles instead
infer_overlap: 128
num_workers: 4
val_every: 2
val_thresholds: [0.6, 0.7, 0.8, 0.9]
val_min_area: 50
seed: 42
wandb: auto
wandb_project: null
wandb_entity: null
