# Encoder screen: current best recipe (skel050: Skeleton Recall 0.5, 512 crops, 30 epochs)
# with an EfficientNet-B4 encoder (timm weights). Stride-2 stem -> high-resolution skips for thin outlines.
# Batch 16 (fits a 16 GB T4: ~11.5 GiB); lr scaled up moderately for the larger batch; encoder at 0.25x lr.
name: unet_effb4_skel050
arch: Unet
encoder: tu-efficientnet_b4
pretrained: true
crop: 512
batch_size: 16
epochs: 30
samples_per_epoch: 4000
pos_fraction: 0.7
augment: base
lr: 0.0007
encoder_lr_mult: 0.25
weight_decay: 0.0001
warmup_epochs: 2
bce_weight: 1.0
dice_weight: 1.0
skel_weight: 0.5
skel_radius: 1
target_mode: random
amp: fp16
num_workers: 4
val_every: 2
val_thresholds: [0.6, 0.7, 0.8, 0.9]
val_min_area: 50
seed: 42
wandb: auto
wandb_project: null
wandb_entity: null
