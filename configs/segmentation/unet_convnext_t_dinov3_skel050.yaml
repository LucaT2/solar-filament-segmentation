# DINOv3 pretraining: as unet_convnext_t_skel050 (fold-0 reference 0.422, 0.439 with the classifier), but the
# ConvNeXt-Tiny encoder starts from Meta's DINOv3 weights (distilled from the self-supervised ViT-7B, LVD-1689M web
# images; timm convnext_tiny.dinov3_lvd1689m) instead of timm's default ImageNet weights. Same architecture, recipe
# and seed: the only difference is the pretraining.
name: unet_convnext_t_dinov3_skel050
arch: Unet
encoder: tu-convnext_tiny.dinov3_lvd1689m
pretrained: true
crop: 512
batch_size: 16
epochs: 30
samples_per_epoch: 4000
pos_fraction: 0.7
augment: base
lr: 0.0007
encoder_lr_mult: 0.25
weight_decay: 0.0001
warmup_epochs: 2
bce_weight: 1.0
dice_weight: 1.0
skel_weight: 0.5
skel_radius: 1
target_mode: random
amp: fp16
num_workers: 4
val_every: 2
val_thresholds: [0.6, 0.7, 0.8, 0.9]
val_min_area: 50
seed: 42
wandb: auto
wandb_project: null
wandb_entity: null
