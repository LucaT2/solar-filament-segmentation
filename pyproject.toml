[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filament"
version = "0.1.0"
description = "Solar filament instance segmentation for the Kaggle Solar Filament Segmentation Challenge 2026"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Luca Tasadan", email = "luca.tasadan@gmail.com" }]
# Runtime dependencies are pinned in requirements.txt.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
